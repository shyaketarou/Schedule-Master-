<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LCY LinkedIn Shared Calendar</title><style>
:root{--bg:#f5f7fb;--line:#dfe4ec;--text:#172033;--muted:#64748b;--accent:#2563eb;--r:#f59e0b;--m:#eab308;--d:#60a5fa;--c:#22c55e;--u:#94a3b8}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,sans-serif;color:var(--text)}header{padding:16px 20px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}h1{margin:0 0 3px;font-size:20px}.sub{font-size:12px;color:var(--muted)}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 11px;cursor:pointer}.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.month{min-width:150px;text-align:center;font-weight:700}.state{font-size:12px;font-weight:700}.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:12px}.legend span{display:flex;align-items:center;gap:6px}.dot{width:9px;height:9px;border-radius:50%}main{padding:18px}.wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px}.weekdays,.grid{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));min-width:1050px}.weekday{padding:10px 12px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:12px;font-weight:700}.day{min-height:155px;padding:7px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.day:nth-child(7n){border-right:0}.day.other{background:#fafafa}.day.today{box-shadow:inset 0 3px 0 var(--accent)}.date{font-size:12px;font-weight:700;color:#475569;margin:2px 3px 7px}.card{background:#fff;border-left:5px solid var(--u);border-radius:7px;padding:8px 9px;margin:7px 0;box-shadow:0 1px 4px #0f172a14;cursor:grab}.title{font-size:12px;line-height:1.35;font-weight:700}.chip{display:inline-block;margin-top:6px;padding:2px 6px;border-radius:999px;background:#eef2f7;color:#475569;font-size:10px;font-weight:700}.meta{font-size:10px;color:#64748b;margin-top:5px}.modal{display:none;position:fixed;inset:0;background:#0f172a59;z-index:20;align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}.dialog{width:min(560px,100%);background:#fff;border-radius:12px;padding:18px}.row{display:grid;gap:6px;margin:10px 0}.row label{font-size:12px;font-weight:700}input,select,textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;font:inherit}.actions{display:flex;justify-content:space-between;margin-top:14px}.right{display:flex;gap:8px}.danger{color:#b91c1c;background:#fff1f2;border-color:#fecaca}.drawer{display:none;position:fixed;right:0;top:0;height:100vh;width:min(520px,95vw);background:#fff;z-index:18;padding:18px;overflow:auto;border-left:1px solid var(--line)}.drawer.open{display:block}.audit{padding:10px 0;border-bottom:1px solid var(--line);font-size:12px}.audit small{color:var(--muted)}</style></head><body>
<header><div class="top"><div><h1>LCY LinkedIn Shared Calendar</h1><div class="sub">GitHub Pages + shared backend · drag to reschedule · persistent edit history</div></div><div class="controls"><span id="state" class="state">● Loading</span><button id="prev">‹</button><span id="month" class="month"></span><button id="next">›</button><button id="today">Today</button><button id="history">Change history</button><button id="add" class="primary">＋ Add post</button></div></div>
<div class="legend"><span><i class="dot" style="background:var(--r)"></i>Pending Client Review</span><span><i class="dot" style="background:var(--m)"></i>Waiting for Client Materials</span><span><i class="dot" style="background:var(--d)"></i>Not Drafted</span><span><i class="dot" style="background:var(--c)"></i>Confirmed</span><span><i class="dot" style="background:var(--u)"></i>Status not specified</span></div></header>
<main><div class="wrap"><div class="weekdays"><div class="weekday">Sun</div><div class="weekday">Mon</div><div class="weekday">Tue</div><div class="weekday">Wed</div><div class="weekday">Thu</div><div class="weekday">Fri</div><div class="weekday">Sat</div></div><div id="cal" class="grid"></div></div></main>
<div id="modal" class="modal"><div class="dialog"><h2 id="mt">Add post</h2><div class="row"><label>Post</label><input id="ft"></div><div class="row"><label>Publish date</label><input id="fd" type="date"></div><div class="row"><label>Status</label><select id="fs"><option value="REVIEW">Pending Client Review</option><option value="MATERIALS">Waiting for Client Materials</option><option value="DRAFT">Not Drafted</option><option value="CONFIRMED">Confirmed</option><option value="UNSPECIFIED">Status not specified</option></select></div><div class="row"><label>Notes</label><textarea id="fn"></textarea></div><div class="actions"><button id="del" class="danger">Delete</button><div class="right"><button id="cancel">Cancel</button><button id="save" class="primary">Save</button></div></div></div></div>
<div id="drawer" class="drawer"><div class="top"><h2 style="margin:0">Change history</h2><button id="closeHistory">×</button></div><div id="logs"></div></div>
<script src="config.js"></script><script>
const LABEL={REVIEW:"Pending Client Review",MATERIALS:"Waiting for Client Materials",DRAFT:"Not Drafted",CONFIRMED:"Confirmed",UNSPECIFIED:"Status not specified"},COLOR={REVIEW:"var(--r)",MATERIALS:"var(--m)",DRAFT:"var(--d)",CONFIRMED:"var(--c)",UNSPECIFIED:"var(--u)"};
let posts=[],view=new Date(2026,9,1),editing=null,editor=localStorage.getItem("lcy_editor")||"";const $=id=>document.getElementById(id),dk=(y,m,d)=>y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0"),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
function api(p,o={}){return fetch(API_BASE_URL.replace(/\/$/,"")+p,{...o,headers:{"Content-Type":"application/json",...(o.headers||{})}}).then(async r=>{let j={};try{j=await r.json()}catch{}if(!r.ok)throw Error(j.error||("HTTP "+r.status));return j})}
function state(t,c){$("state").textContent=t;$("state").style.color=c||"#15803d"}
function who(){if(editor)return true;let n=prompt("Enter your name for the change history.");if(!n||!n.trim())return false;editor=n.trim().slice(0,80);localStorage.setItem("lcy_editor",editor);return true}
async function load(){state("● Loading","#b45309");try{posts=(await api("/api/posts")).posts||[];state("● Shared / saved");render()}catch(e){state("● Backend error","#b91c1c");alert(e.message)}}
async function savePost(p,a){if(!who())return;state("● Saving…","#b45309");try{await api("/api/posts",{method:"POST",body:JSON.stringify({...p,editor,action:a})});close();await load()}catch(e){state("● Save failed","#b91c1c");alert(e.message)}}
async function del(){if(!editing||!who()||!confirm("Delete this post?"))return;try{await api("/api/posts/"+encodeURIComponent(editing),{method:"DELETE",body:JSON.stringify({editor})});close();await load()}catch(e){alert(e.message)}}
async function audit(){try{let r=await api("/api/audit");$("drawer").classList.add("open");$("logs").innerHTML=(r.logs||[]).map(x=>"<div class='audit'><b>"+esc(x.action)+" · "+esc(x.postTitle||"")+"</b><br><small>"+esc(new Date(x.timestamp).toLocaleString())+" · "+esc(x.editor)+"</small></div>").join("")||"<p>No changes yet.</p>"}catch(e){alert(e.message)}}
function render(){const y=view.getFullYear(),m=view.getMonth();$("month").textContent=view.toLocaleDateString("en-US",{month:"long",year:"numeric"});const cal=$("cal");cal.innerHTML="";const f=new Date(y,m,1),s=f.getDay(),dim=new Date(y,m+1,0).getDate(),dip=new Date(y,m,0).getDate();for(let i=0;i<42;i++){let d=i-s,cm=m,cy=y,o=false;d++;if(d<1){d=dip+d;cm--;if(cm<0){cm=11;cy--}o=true}else if(d>dim){d-=dim;cm++;if(cm>11){cm=0;cy++}o=true}const k=dk(cy,cm,d),day=document.createElement("div");day.className="day"+(o?" other":"");const n=new Date();if(k===dk(n.getFullYear(),n.getMonth(),n.getDate()))day.classList.add("today");day.innerHTML="<div class='date'>"+d+"</div>";posts.filter(p=>p.date===k).forEach(p=>day.appendChild(card(p)));day.ondragover=e=>e.preventDefault();day.ondrop=e=>{e.preventDefault();const p=posts.find(x=>x.id===e.dataTransfer.getData("text/plain"));if(p&&p.date!==k)savePost({...p,date:k},"RESCHEDULE")};cal.appendChild(day)}}
function card(p){const d=document.createElement("div");d.className="card";d.draggable=true;d.style.borderLeftColor=COLOR[p.status]||COLOR.UNSPECIFIED;d.innerHTML="<div class='title'>"+esc(p.title)+"</div><div class='chip'>"+esc(LABEL[p.status]||LABEL.UNSPECIFIED)+"</div>"+(p.notes?"<div class='meta'>"+esc(p.notes)+"</div>":"");d.ondragstart=e=>e.dataTransfer.setData("text/plain",p.id);d.onclick=()=>open(p);return d}
function open(p=null){editing=p?.id||null;$("mt").textContent=p?"Edit post":"Add post";$("ft").value=p?.title||"";$("fd").value=p?.date||"";$("fs").value=p?.status||"UNSPECIFIED";$("fn").value=p?.notes||"";$("del").style.display=p?"block":"none";$("modal").classList.add("open")}
function close(){$("modal").classList.remove("open");editing=null}
$("save").onclick=()=>{let t=$("ft").value.trim();if(!t)return;savePost({id:editing||"p"+Date.now(),title:t,date:$("fd").value||"",status:$("fs").value,notes:$("fn").value.trim()},editing?"EDIT":"CREATE")};$("del").onclick=del;$("cancel").onclick=close;$("modal").onclick=e=>{if(e.target.id==="modal")close()};$("add").onclick=()=>open();$("prev").onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);render()};$("next").onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);render()};$("today").onclick=()=>{let n=new Date();view=new Date(n.getFullYear(),n.getMonth(),1);render()};$("history").onclick=audit;$("closeHistory").onclick=()=>$("drawer").classList.remove("open");if(typeof API_BASE_URL!=="string"||!API_BASE_URL.startsWith("http")){state("● Setup required","#b91c1c");alert("Set API_BASE_URL in config.js to your Azure Function URL.")}else load();
</script></body></html>
